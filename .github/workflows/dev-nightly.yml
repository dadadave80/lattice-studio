# Called only after full CI succeeds on dev. npm approval, including 2FA, remains a human step.
name: Stage dev nightly

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write # npm provenance
  statuses: write # durable deduplication after approval, rejection or expiry

concurrency:
  group: dev-nightly
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  stage:
    name: Stage the tested dev commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify tested dev commit
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/dev" || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Nightly staging requires full CI dispatched on dev."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::The checkout differs from the commit that passed CI."
            exit 1
          fi
          echo "Verified tested dev commit $GITHUB_SHA."

      - name: Check staging history
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          staged=$(gh api --paginate "repos/$GH_REPO/commits/$GITHUB_SHA/statuses?per_page=100" \
            --jq '.[] | select(.context == "npm/dev-nightly" and .state == "success") | .id')
          if [[ -n "$staged" ]]; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
            echo "Skipped $GITHUB_SHA because it was already staged for npm approval."
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install npm for staged publishing
        if: steps.marker.outputs.staged != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/npm-cli"
          bun add --cwd "$RUNNER_TEMP/npm-cli" --no-save --ignore-scripts npm@11.15.0

      - name: Prepare npm authentication
        if: steps.marker.outputs.staged != 'true'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-cli.npmrc
        run: |
          cat > "$NPM_CONFIG_USERCONFIG" <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC

      - name: Check npm for this commit
        id: package
        if: steps.marker.outputs.staged != 'true'
        run: bun scripts/ci/dev-nightly.ts check
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-cli.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.marker.outputs.staged != 'true' && steps.package.outputs.exists != 'true'
        run: bun install --frozen-lockfile

      - name: Set nightly CLI version
        if: steps.marker.outputs.staged != 'true' && steps.package.outputs.exists != 'true'
        env:
          NIGHTLY_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # shellcheck disable=SC2016
          bun -e '
            const version = process.env.NIGHTLY_VERSION;
            if (!version) throw new Error("Missing checked nightly version");
            const path = "packages/cli/package.json";
            const pkg = await Bun.file(path).json();
            pkg.version = version;
            await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log(`Prepared CLI version ${version}.`);
          '

      - if: steps.marker.outputs.staged != 'true' && steps.package.outputs.exists != 'true'
        run: bun run --cwd packages/cli build

      - name: Prepare a publishable package.json
        if: steps.marker.outputs.staged != 'true' && steps.package.outputs.exists != 'true'
        run: bun scripts/ci/prepare-cli-package.ts

      - name: Stage dev CLI package
        if: steps.marker.outputs.staged != 'true' && steps.package.outputs.exists != 'true'
        run: bun scripts/ci/dev-nightly.ts stage
        env:
          NIGHTLY_VERSION: ${{ steps.package.outputs.version }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-cli.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A confirmed npm version also repairs a marker lost after a successful staging response.
      - name: Record staged commit
        if: steps.marker.outputs.staged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh api --method POST "repos/$GH_REPO/statuses/$GITHUB_SHA" \
            --field state=success \
            --field context=npm/dev-nightly \
            --field "target_url=$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" \
            --field "description=Staged $NIGHTLY_VERSION for npm approval"
          echo "Recorded $GITHUB_SHA as staged. Approve its dev package on npm with 2FA."
