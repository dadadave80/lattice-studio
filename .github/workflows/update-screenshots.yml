# Regenerates the `chromium-linux` screenshot baselines (§17 audit #79, spec L937): every `toMatchScreenshot`
# baseline committed today is `*-chromium-darwin.png` (made on a Mac), but `ci.yml`'s `browser` job runs on
# `ubuntu-latest`, so the very first Linux run has no `chromium-linux` reference to compare against and the
# Components gate fails on missing baselines, not a real difference. Manual only (`workflow_dispatch`): this
# writes an artifact for a person to review and commit, it never commits on its own and never runs as part of a
# pull request. Committing the result waits on David's repository existing (HANDOFF.md D4; docs/release.md).
name: Update Linux screenshot baselines

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "22"

jobs:
  update-baselines:
    name: bun x vitest run --update (chromium, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun x playwright install --with-deps chromium
      # Bypasses `bun run test:browser` (scripts/dev/test-browser.ts, orchestrator-owned) to pass Vitest's own
      # `--update` flag directly: every `toMatchScreenshot` call without a matching `chromium-linux` reference
      # writes one instead of failing, and platform naming means the committed `chromium-darwin` baselines are
      # never touched.
      - name: Regenerate every missing chromium-linux baseline
        working-directory: apps/studio
        run: bun x vitest run --update --passWithNoTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-linux-baselines
          path: apps/studio/**/__screenshots__/**/*-chromium-linux.png
          retention-days: 30
