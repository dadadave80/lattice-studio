# Stages `lattice-studio` (packages/cli) on npm with provenance. David dispatches this workflow from a
# release tag, then reviews and approves the staged package on npm with 2FA.
name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to stage the matching lattice-studio-vX.Y.Z release tag for npm approval.'
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

env:
  BUN_VERSION: "1.4.2"

jobs:
  publish:
    name: npm stage publish --provenance
    runs-on: ubuntu-24.04
    if: github.event.inputs.confirm == 'publish'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify CLI release tag
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$GITHUB_REF" != "refs/tags/lattice-studio-v$version" ]]; then
            echo "::error::Dispatch from the CLI release tag lattice-studio-v$version."
            exit 1
          fi
          echo "Verified CLI release tag lattice-studio-v$version."

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm for staged publishing
        run: npm install --global npm@11.15.0

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/cli build

      # A copy, never the workspace file: the published package.json drops `private` (npm refuses to publish
      # a private package) and every `workspace:*` dependency (npm doesn't understand that protocol), so the
      # workspace's own package.json is untouched.
      - name: Prepare a publishable package.json
        run: |
          bun -e '
            const path = "packages/cli/package.json";
            const pkg = await Bun.file(path).json();
            delete pkg.private;
            for (const field of ["dependencies", "devDependencies", "peerDependencies"]) {
              const deps = pkg[field];
              if (!deps) continue;
              for (const [name, range] of Object.entries(deps)) {
                if (typeof range === "string" && range.startsWith("workspace:")) delete deps[name];
              }
            }
            await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n");
          '

      - run: npm stage publish --provenance --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
