# Stages `lattice-studio` (packages/cli) on npm with provenance. David dispatches this workflow from a
# release tag, then reviews and approves the staged package on npm with 2FA.
name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to stage the matching lattice-studio-vX.Y.Z release tag for npm approval.'
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

env:
  BUN_VERSION: "1.4.2"

jobs:
  publish:
    name: npm stage publish --provenance
    runs-on: ubuntu-24.04
    if: github.event.inputs.confirm == 'publish'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify CLI release tag
        run: |
          version=$(bun -p "require('./packages/cli/package.json').version")
          if [[ "$GITHUB_REF" != "refs/tags/lattice-studio-v$version" ]]; then
            echo "::error::Dispatch from the CLI release tag lattice-studio-v$version."
            exit 1
          fi
          echo "Verified CLI release tag lattice-studio-v$version."

      - name: Install npm for staged publishing
        run: |
          mkdir -p "$RUNNER_TEMP/npm-cli"
          bun add --cwd "$RUNNER_TEMP/npm-cli" --no-save --ignore-scripts npm@11.15.0

      - run: bun install --frozen-lockfile

      - run: bun run --cwd packages/cli build

      # Prepare this disposable checkout after bundling the workspace dependencies.
      - name: Prepare a publishable package.json
        run: bun scripts/ci/prepare-cli-package.ts

      - name: Stage CLI package
        run: |
          cat > "$NPM_CONFIG_USERCONFIG" <<'NPMRC'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          bun "$RUNNER_TEMP/npm-cli/node_modules/npm/bin/npm-cli.js" stage publish --provenance --access public
        working-directory: packages/cli
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-cli.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
