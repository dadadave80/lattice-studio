name: GitHub dev nightly

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: github-dev-nightly-release
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  release:
    name: Publish the tested dev CLI pre-release
    if: github.repository == 'dadadave80/lattice-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Inspect the tested nightly
        id: nightly
        run: bun scripts/ci/github-nightly.ts inspect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.nightly.outputs.published == 'false' && steps.nightly.outputs.superseded == 'false'
        with:
          node-version: "22"

      - name: Install frozen dependencies
        if: steps.nightly.outputs.published == 'false' && steps.nightly.outputs.superseded == 'false'
        run: bun install --frozen-lockfile

      - name: Build and smoke-test nightly assets
        if: steps.nightly.outputs.published == 'false' && steps.nightly.outputs.superseded == 'false'
        run: bun scripts/ci/github-nightly-assets.ts build
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}

      - name: Create the repository release token
        if: steps.nightly.outputs.published == 'false' && steps.nightly.outputs.superseded == 'false'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Publish the verified nightly
        if: steps.nightly.outputs.published == 'false' && steps.nightly.outputs.superseded == 'false'
        run: bun scripts/ci/github-nightly.ts publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
