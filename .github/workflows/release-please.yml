# Versions and changelog from conventional commits (spec "Versions and changelog"; Developer experience →
# Building Studio → Workflow). Opens or updates a "release please" PR on every push to main; merging that PR
# tags the release, for either manifest package (packages/cli, apps/studio). Not run until David pushes the
# repo (HANDOFF.md D4).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  BUN_VERSION: "1.4.2"

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The lattice-release-please app's token, as in Lattice: a PR opened with the default token runs no
      # workflows, and GitHub signs the commits an app makes through the API.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # The release PR bumps apps/studio/package.json, and Settings → About shows that version, so the bundle and
      # with it the CSP hash change. Regenerate vercel.json on the release branch, or its Vercel deploy and Size
      # budgets fail (#31). Runs each time release-please opens or rewrites the PR.
      # The branch name via jq, not fromJSON: on a release run `pr` is empty, and GitHub evaluates a skipped step's
      # fromJSON anyway, which failed the run before the catalog hash steps (0.1.0).
      - id: release-pr
        if: steps.release.outputs.pr
        env:
          PR: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(jq -r .headBranchName <<<"$PR")" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
      - if: steps.release.outputs.pr
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Regenerate vercel.json on the release PR
        if: steps.release.outputs.pr
        env:
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          bun install --frozen-lockfile
          STUDIO_VERCEL_JSON=1 bun run build
          if git diff --quiet apps/studio/vercel.json; then
            echo "vercel.json already matches the release build."
            exit 0
          fi
          git config user.name "lattice-release-please[bot]"
          git config user.email "339286633+lattice-release-please[bot]@users.noreply.github.com"
          git commit -m "build(studio): vercel.json regenerated for the release build" apps/studio/vercel.json
          git push origin "HEAD:$BRANCH"

      # The catalog hash published with the release (§16 audit #7, spec L855): each manifest package gets its
      # own tag, so a release of either carries the committed catalog's hash in its notes.
      - if: steps.release.outputs['packages/cli--release_created'] == 'true' || steps.release.outputs['apps/studio--release_created'] == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.release.outputs['packages/cli--release_created'] == 'true' || steps.release.outputs['apps/studio--release_created'] == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Append the catalog hash to the CLI release notes
        if: steps.release.outputs['packages/cli--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs['packages/cli--tag_name'] }}
        run: bun scripts/ci/append-catalog-hash-to-release.ts "$TAG_NAME"

      - name: Append the catalog hash to the Studio release notes
        if: steps.release.outputs['apps/studio--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs['apps/studio--tag_name'] }}
        run: bun scripts/ci/append-catalog-hash-to-release.ts "$TAG_NAME"
