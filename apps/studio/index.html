<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Lattice Studio</title>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <style>
      /*
       * Static first paint (spec L821-L826): the title bar and pane outlines below, sized to match the real
       * shell (apps/studio/src/shell/Shell.module.css, TitleBar.module.css, panes.ts PANE_SIZES) so replacing
       * this markup with the mounted app doesn't move anything already on screen. The build writes this
       * style's hash into the CSP (build/csp.ts).
       *
       * Values are copied from packages/tokens/dist/tokens.css, which loads after this page's first paint, so
       * this can't reference it. If T1 changes those values, this block needs the same edit.
       */
      :root {
        --lxs-space-1: 4px;
        --lxs-space-2: 8px;
        --lxs-space-8: 32px;
        --lxs-stroke-hair: 1px;
      }
      :root[data-theme="dark"] {
        --lxs-ground: #0c0d0f;
        --lxs-panel: #131417;
        --lxs-sunken: #0a0b0d;
        --lxs-text: #e9e7e1;
        --lxs-border-subtle: rgba(233, 231, 225, 0.12);
      }
      :root[data-theme="light"] {
        --lxs-ground: #f3f1e9;
        --lxs-panel: #f7f5ef;
        --lxs-sunken: #e7e3d8;
        --lxs-text: #16150f;
        --lxs-border-subtle: rgba(22, 21, 15, 0.22);
      }
      .lxs-shell,
      .lxs-shell *,
      .lxs-shell *::before,
      .lxs-shell *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        block-size: 100%;
      }
      html {
        background: var(--lxs-ground);
        color: var(--lxs-text);
        font-family:
          Inter,
          "Inter Fallback",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        block-size: 100%;
      }
      .lxs-shell {
        display: flex;
        flex-direction: column;
        block-size: 100vh;
        block-size: 100dvh;
        min-inline-size: 0;
        overflow: hidden;
      }
      .lxs-titlebar {
        flex: none;
        display: flex;
        align-items: center;
        gap: var(--lxs-space-2);
        block-size: calc(var(--lxs-space-8) + var(--lxs-space-2));
        min-inline-size: 0;
        padding-inline: var(--lxs-space-2);
        background: var(--lxs-panel);
        border-block-end: var(--lxs-stroke-hair) solid var(--lxs-border-subtle);
        font: 600 13px/20px Inter, "Inter Fallback", system-ui, sans-serif;
      }
      .lxs-body {
        position: relative;
        display: flex;
        flex: 1 1 0;
        min-block-size: 0;
        min-inline-size: 0;
      }
      .lxs-pane {
        display: none;
        flex: none;
        min-block-size: 0;
        background: var(--lxs-panel);
      }
      .lxs-pane--left {
        inline-size: 240px;
        border-inline-end: var(--lxs-stroke-hair) solid var(--lxs-border-subtle);
      }
      .lxs-pane--inspector {
        inline-size: 316px;
        border-inline-start: var(--lxs-stroke-hair) solid var(--lxs-border-subtle);
      }
      .lxs-sheet {
        position: relative;
        flex: 1 1 0;
        min-inline-size: 0;
        min-block-size: 0;
        background: var(--lxs-ground);
      }
      .lxs-console {
        flex: none;
        block-size: calc(var(--lxs-space-8) + var(--lxs-space-1) + 124px);
        min-block-size: 0;
        background: var(--lxs-sunken);
        border-block-start: var(--lxs-stroke-hair) solid var(--lxs-border-subtle);
      }
      /* 1280 px and wider (spec L347-L370): the left pane and the inspector show beside the sheet. */
      @media (min-width: 1280px) {
        .lxs-pane {
          display: flex;
          flex-direction: column;
        }
      }
      /* Under 768 px: one pane at a time, picked by the switcher; the console isn't one of the panes shown. */
      @media (max-width: 767px) {
        .lxs-console {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="lxs-shell" data-static-shell>
        <header class="lxs-titlebar" role="banner" aria-label="Title bar">
          <span>Lattice Studio</span>
        </header>
        <div class="lxs-body">
          <aside class="lxs-pane lxs-pane--left" aria-label="Left pane"></aside>
          <main class="lxs-sheet" aria-label="Sheet"></main>
          <aside class="lxs-pane lxs-pane--inspector" aria-label="Inspector"></aside>
        </div>
        <footer class="lxs-console" aria-label="Console"></footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
