# The default, immutable overload: DeployERC20's four cuts (script/base/tokens/DeployERC20.s.sol#L60-L63), then ERC20Burnable, with ERC20Init and
# ERC20BurnableInit in one MultiInit. The script nests DeployERC20's MultiInit, so its introspection step runs
# between the two; Studio's planner appends the same step at the end instead.
name: ERC20Burnable
script: script/base/tokens/DeployERC20Burnable.s.sol
buildCuts: buildCuts(string,string)
source: script/base/tokens/DeployERC20Burnable.s.sol#L29-L49
proxy: Lattice
phase: v1.1
immutable: true
cuts:
  - add: ERC165Facet
    source: script/base/tokens/DeployERC20.s.sol#L60-L60
  - add: ERC20
    source: script/base/tokens/DeployERC20.s.sol#L61-L61
  - add: DiamondLoupeFacet
    source: script/base/tokens/DeployERC20.s.sol#L62-L62
  - add: Receive
    source: script/base/tokens/DeployERC20.s.sol#L63-L63
  - add: ERC20Burnable
    source: script/base/tokens/DeployERC20Burnable.s.sol#L40-L40
init:
  kind: steps
  steps:
    - spec: ERC20Init
      args: {}  # the script passes (name_, symbol_)
      source: script/base/tokens/DeployERC20.s.sol#L35-L36
    - spec: ERC20BurnableInit
      args: {}
  source: script/base/tokens/DeployERC20Burnable.s.sol#L42-L48
gaps: >-
  No example arguments yet: the script takes every init argument as a parameter (name_, symbol_).
