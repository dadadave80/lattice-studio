# What DeploySafeDiamondCut.buildCuts builds: six facets and a direct call to SafeDiamondCutInit, which sets the
# ERC-165 flags itself, so no introspection step follows. One stored step encodes as a direct call.
name: SafeDiamondCut
order: 3
script: script/base/governance/DeploySafeDiamondCut.s.sol
buildCuts: buildCuts(address,address,uint256)
source: script/base/governance/DeploySafeDiamondCut.s.sol#L31-L44
proxy: Lattice
phase: v1
cuts:
  - add: ERC165Facet
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L36-L36
  - add: DiamondLoupeFacet
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L37-L37
  - add: AccessControl
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L38-L38
  - add: EmergencyStop
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L39-L39
  - add: SafeDiamondCut
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L40-L40
  - add: Receive
    source: script/base/governance/DeploySafeDiamondCut.s.sol#L41-L41
init:
  kind: steps
  steps:
    # admin: the deploying account, resolved when the transaction is built (spec L285, R7). safe: left for the
    # user, since it must hold a Safe on the chosen chain (INIT-01). minThreshold: Studio's example (the overlay's).
    - spec: SafeDiamondCutInit
      args:
        admin: { $ref: deployer }
        minThreshold: "2"
  source: script/base/governance/DeploySafeDiamondCut.s.sol#L42-L43
