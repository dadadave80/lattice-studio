# What DeployGovernedVault.buildCuts builds at the pin: 14 facets, the reconciled selectors excluded from the
# base facets with _cutExcept and served once by GovernedVault (or VaultCore, ERC4626, ERC20Votes), and
# GovernedVaultInit as one bundle. The script's note on clock and CLOCK_MODE ("the Votes clock serves both",
# L34) is wrong: Votes and Governor both exclude them, so GovernedVault serves them (golden routing).
name: GovernedVault
order: 1
script: script/base/defi/DeployGovernedVault.s.sol
buildCuts: buildCuts((address,string,string,uint8,uint256,uint48,uint32,uint256,uint256))
source: script/base/defi/DeployGovernedVault.s.sol#L45-L53
proxy: Lattice
phase: v1
cuts:
  - add: ERC165Facet
    source: script/base/defi/DeployGovernedVault.s.sol#L133-L133
  - add: AccessControl
    source: script/base/defi/DeployGovernedVault.s.sol#L134-L134
  - add: TimelockController
    source: script/base/defi/DeployGovernedVault.s.sol#L135-L135
  - add: ERC20
    except: ["name()", "decimals()", "transfer(address,uint256)", "transferFrom(address,address,uint256)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L136-L136
    listSource: script/base/defi/DeployGovernedVault.s.sol#L172-L178
  - add: ERC4626
    except:
      - "totalAssets()"
      - "deposit(uint256,address)"
      - "mint(uint256,address)"
      - "withdraw(uint256,address,address)"
      - "redeem(uint256,address,address)"
      - "maxDeposit(address)"
      - "maxMint(address)"
    source: script/base/defi/DeployGovernedVault.s.sol#L137-L137
    listSource: script/base/defi/DeployGovernedVault.s.sol#L182-L191
  - add: VaultCore
    except: ["deposit(uint256,address)", "mint(uint256,address)", "withdraw(uint256,address,address)", "redeem(uint256,address,address)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L138-L138
    listSource: script/base/defi/DeployGovernedVault.s.sol#L194-L200
  - add: Votes
    except: ["delegate(address)", "delegateBySig(address,uint256,uint256,uint8,bytes32,bytes32)", "clock()", "CLOCK_MODE()"]
    source: script/base/defi/DeployGovernedVault.s.sol#L139-L139
    listSource: script/base/defi/DeployGovernedVault.s.sol#L203-L209
  - add: ERC20Votes
    except: ["transfer(address,uint256)", "transferFrom(address,address,uint256)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L140-L140
    listSource: script/base/defi/DeployGovernedVault.s.sol#L212-L216
  - add: Governor
    except: ["name()", "clock()", "CLOCK_MODE()", "castVoteBySig(uint256,uint8,address,bytes)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L141-L141
    listSource: script/base/defi/DeployGovernedVault.s.sol#L219-L225
  - add: GovernedVault
    source: script/base/defi/DeployGovernedVault.s.sol#L142-L142
  - add: DiamondLoupeFacet
    source: script/base/defi/DeployGovernedVault.s.sol#L143-L143
  - add: EmergencyStop
    source: script/base/defi/DeployGovernedVault.s.sol#L144-L144
  - add: GovernedDiamondCut
    source: script/base/defi/DeployGovernedVault.s.sol#L145-L145
  - add: Receive
    source: script/base/defi/DeployGovernedVault.s.sol#L146-L146
init:
  kind: bundle
  spec: GovernedVaultInit
  # GrantExample's values (script/base/defi/GrantExample.s.sol#L26-L26), the same as GovernedVaultInit's overlay
  # examples. `asset` is left empty: GrantExample deploys a fresh test token, so the user fills it in (INIT-01).
  args:
    p:
      name: "Grant vault"
      symbol: "gVLT"
      decimalsOffset: "0"
      minDelay: "300"
      votingDelay: "60"
      votingPeriod: "600"
      proposalThreshold: "0"
      quorumNumerator: "4"
  source: script/base/defi/DeployGovernedVault.s.sol#L51-L52
