# DeployGovernedVault's 14 base cuts (_buildBaseCuts, cited in DeployGovernedVault.s.sol) plus ENSReverseClaimer,
# initialized by the GovernedVaultENSInit bundle, which replays GovernedVaultInit's sequence and wires ENS.
name: GovernedVaultENS
script: script/base/defi/DeployGovernedVaultENS.s.sol
buildCuts: buildCutsWithENS(((address,string,string,uint8,uint256,uint48,uint32,uint256,uint256),address,string))
source: script/base/defi/DeployGovernedVaultENS.s.sol#L134-L147
proxy: Lattice
phase: v1.1
cuts:
  - add: ERC165Facet
    source: script/base/defi/DeployGovernedVault.s.sol#L78-L78
  - add: AccessControl
    source: script/base/defi/DeployGovernedVault.s.sol#L79-L79
  - add: TimelockController
    source: script/base/defi/DeployGovernedVault.s.sol#L80-L80
