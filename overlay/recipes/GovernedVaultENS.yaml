    source: script/base/defi/DeployGovernedVault.s.sol#L86-L86
    listSource: script/base/defi/DeployGovernedVault.s.sol#L161-L167
  - add: GovernedVault
    source: script/base/defi/DeployGovernedVault.s.sol#L87-L87
  - add: DiamondLoupeFacet
    source: script/base/defi/DeployGovernedVault.s.sol#L88-L88
  - add: EmergencyStop
    source: script/base/defi/DeployGovernedVault.s.sol#L89-L89
  - add: GovernedDiamondCut
    source: script/base/defi/DeployGovernedVault.s.sol#L90-L90
  - add: Receive
    source: script/base/defi/DeployGovernedVault.s.sol#L91-L91
  - add: ENSReverseClaimer
    source: script/base/defi/DeployGovernedVaultENS.s.sol#L143-L143
init:
  kind: bundle
  spec: GovernedVaultENSInit
  args: {}  # the script passes (p)
  source: script/base/defi/DeployGovernedVaultENS.s.sol#L145-L146
gaps: >-
  No example arguments yet: the script takes the vault, reverse registrar and ENS name as one parameter (p).
