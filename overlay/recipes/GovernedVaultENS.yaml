      - "redeem(uint256,address,address)"
    source: script/base/defi/DeployGovernedVault.s.sol#L82-L82
    listSource: script/base/defi/DeployGovernedVault.s.sol#L126-L133
  - add: VaultCore
    except: ["deposit(uint256,address)", "mint(uint256,address)", "withdraw(uint256,address,address)", "redeem(uint256,address,address)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L83-L83
    listSource: script/base/defi/DeployGovernedVault.s.sol#L136-L142
  - add: Votes
    except: ["delegate(address)", "delegateBySig(address,uint256,uint256,uint8,bytes32,bytes32)", "clock()", "CLOCK_MODE()"]
    source: script/base/defi/DeployGovernedVault.s.sol#L84-L84
    listSource: script/base/defi/DeployGovernedVault.s.sol#L145-L151
  - add: ERC20Votes
    except: ["transfer(address,uint256)", "transferFrom(address,address,uint256)"]
    source: script/base/defi/DeployGovernedVault.s.sol#L85-L85
    listSource: script/base/defi/DeployGovernedVault.s.sol#L154-L158
  - add: Governor
