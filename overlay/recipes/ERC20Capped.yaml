# The default, immutable overload: DeployERC20's three cuts (script/base/tokens/DeployERC20.s.sol#L59-L61), then ERC20Capped, with ERC20Init and
# ERC20CappedInit in one MultiInit. The script nests DeployERC20's MultiInit, so its introspection step runs
# between the two; Studio's planner appends the same step at the end instead.
name: ERC20Capped
script: script/base/tokens/DeployERC20Capped.s.sol
buildCuts: buildCuts(string,string,uint256)
source: script/base/tokens/DeployERC20Capped.s.sol#L30-L50
proxy: Lattice
phase: v1.1
immutable: true
cuts:
  - add: ERC165Facet
    source: script/base/tokens/DeployERC20.s.sol#L59-L59
  - add: ERC20
    source: script/base/tokens/DeployERC20.s.sol#L60-L60
  - add: DiamondLoupeFacet
    source: script/base/tokens/DeployERC20.s.sol#L61-L61
  - add: ERC20Capped
    source: script/base/tokens/DeployERC20Capped.s.sol#L41-L41
init:
  kind: steps
  steps:
    - spec: ERC20Init
      args: {}  # the script passes (name_, symbol_)
      source: script/base/tokens/DeployERC20.s.sol#L34-L35
    - spec: ERC20CappedInit
      args: {}  # the script passes (cap_)
  source: script/base/tokens/DeployERC20Capped.s.sol#L43-L49
gaps: >-
  No example arguments yet: the script takes every init argument as a parameter (name_, symbol_; cap_).
