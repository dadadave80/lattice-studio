# The default, immutable overload: ERC165Facet, ERC20, ERC4626 as a mixed cut (Add the vault surface, Replace
# ERC20's decimals with the share-offset variant), and DiamondLoupeFacet, with ERC4626Init.
name: ERC4626
script: script/base/tokens/DeployERC4626.s.sol
buildCuts: buildCuts(address,string,string,uint8)
source: script/base/tokens/DeployERC4626.s.sol#L36-L44
proxy: Lattice
phase: v1.1
immutable: true
cuts:
  - add: ERC165Facet
    source: script/base/tokens/DeployERC4626.s.sol#L71-L71
  - add: ERC20
    source: script/base/tokens/DeployERC4626.s.sol#L72-L72
  - add: ERC4626
    selectors:
      - "asset()"
      - "totalAssets()"
      - "convertToShares(uint256)"
      - "convertToAssets(uint256)"
      - "maxDeposit(address)"
      - "maxMint(address)"
      - "maxWithdraw(address)"
      - "maxRedeem(address)"
      - "previewDeposit(uint256)"
      - "previewMint(uint256)"
      - "previewWithdraw(uint256)"
      - "previewRedeem(uint256)"
      - "deposit(uint256,address)"
      - "mint(uint256,address)"
      - "withdraw(uint256,address,address)"
      - "redeem(uint256,address,address)"
    source: script/base/tokens/DeployERC4626.s.sol#L68-L73
    listSource: script/base/tokens/DeployERC4626.s.sol#L80-L98
  - replace: ERC4626
    selectors: ["decimals()"]
    source: script/base/tokens/DeployERC4626.s.sol#L68-L75
    listSource: script/base/tokens/DeployERC4626.s.sol#L101-L104
  - add: DiamondLoupeFacet
    source: script/base/tokens/DeployERC4626.s.sol#L76-L76
init:
  kind: steps
  steps:
    - spec: ERC4626Init
      args: {}  # the script passes (asset_, name_, symbol_, decimalsOffset_)
  source: script/base/tokens/DeployERC4626.s.sol#L41-L43
gaps: >-
  No example arguments yet: the script takes every init argument as a parameter (asset_, name_, symbol_,
  decimalsOffset_).
