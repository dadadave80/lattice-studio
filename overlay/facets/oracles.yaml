API3Adapter:
  requires: []
  init:
    name: API3AdapterInit
    source: src/oracles/api3/API3AdapterInit.sol#L18-L21
  seamReview: >-
    getFeed, latestAnswer, registerFeed and unregisterFeed are shared with the other price adapters. latestAnswer is
    the common read surface by design (src/interfaces/oracles/IPriceOracleReader.sol L6-L14), each adapter reads its
    own feed registry, and no deploy script or doc pins an owner, so the user chooses (SEL-01).
  notes: >-
    Every Lattice price adapter ships as its own diamond in script/base/oracles. When two share a diamond, route all
    of an adapter's feed selectors to it: a feed registered through one adapter is invisible to another's reads.
API3QRNGAdapter:
  requires: []
  init:
    name: API3QRNGAdapterInit
    source: src/oracles/api3/API3QRNGAdapterInit.sol#L18-L21
  seamReview: >-
    getConfig is shared with ChainlinkVRF, GelatoAutomateAdapter and PythEntropyAdapter; each returns its own
    provider's config, and no deploy script or doc pins an owner, so the user chooses (SEL-01).
