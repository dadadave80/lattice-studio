AccessControl:
  requires: []
  family:
    name: access
    # Each flavor "is cut in place of the base AccessControl facet (cutting both would collide on the shared role
    # selectors)".
    source: script/base/access/DeployAccessControlEnumerable.s.sol#L17-L18
  init:
    name: AccessControlInit
    source: src/access/AccessControlInit.sol#L16-L16
  seamReview: >-
    getRoleAdmin, grantRole, hasRole, renounceRole and revokeRole are shared with AccessControlEnumerable and
    AccessControlTimed; the deploy scripts cut those flavors in place of AccessControl because both would collide on
    the role selectors, and the access family (DEP-03) keeps them apart, so no default owner or seam applies.

