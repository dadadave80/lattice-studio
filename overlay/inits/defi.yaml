VaultCoreInit:
  kind: step
  source: src/defi/VaultCoreInit.sol#L24-L31
  params:
    asset_:
      rule: nonzero&code(token)
      # Stored as the vault's asset; its decimals() is read at init.
      source: src/tokens/ERC4626/libraries/ERC4626Lib.sol#L69-L81
    admin_:
      rule: nonzero
      authority: true
      role: DEFAULT_ADMIN_ROLE
      source: src/defi/VaultCoreInit.sol#L22-L27
  after:
    # Satisfied by VaultCoreInit itself, which runs AccessControl and ERC4626 first (contracts §4 `after`).
    - module: AccessControl
      source: src/defi/libraries/VaultCoreLib.sol#L64-L65
    - module: ERC4626
      source: src/defi/libraries/VaultCoreLib.sol#L64-L65
