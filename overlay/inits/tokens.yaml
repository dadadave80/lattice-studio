ERC4626Init:
  kind: step
  source: src/tokens/ERC4626/ERC4626Init.sol#L22-L25
  notes: >-
    asset_'s rule is K3's and Studio's own check: ERC4626Lib stores the asset and falls back to 18 decimals when
    decimals() fails, without rejecting zero or a codeless address.
  params:
    asset_:
      rule: nonzero&code(token)
      source: src/tokens/ERC4626/libraries/ERC4626Lib.sol#L74-L81

